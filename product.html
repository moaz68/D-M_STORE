<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&M - Product Details</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons (Lucide) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Tailwind CSS (via CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E3A2B',
                        accent: '#C49A6C',
                        bglight: '#F4F1EA'
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Existing Styles (for navbar and base layout) -->
    <link rel="stylesheet" href="style.css">

    <style>
        /* Magnifier / Zoom styles */
        .zoom-container {
            position: relative;
            overflow: hidden;
            cursor: zoom-in;
            border-radius: 1rem;
        }
        
        .zoom-image {
            width: 100%;
            height: auto;
            transition: transform 0.1s ease;
            transform-origin: center center;
            display: block;
        }

        /* Pill hover styles */
        .size-pill.active {
            background-color: #1E3A2B;
            color: white;
            border-color: #1E3A2B;
        }
    </style>
</head>
<body class="bg-bglight text-primary font-sans">
    <!-- 1. Top Announcement Bar -->
    <div class="announcement-bar">
        <button class="nav-arrow" aria-label="Previous announcement">
            <i data-lucide="chevron-left"></i>
        </button>
        <p class="announcement-text">Your Journey Starts Here | Welcome to D&M</p>
        <button class="nav-arrow" aria-label="Next announcement">
            <i data-lucide="chevron-right"></i>
        </button>
    </div>

    <!-- 2. Main Navbar Layout -->
    <header class="main-header">
        <nav class="navbar">
            <div class="nav-left">
                <a href="index.html" class="logo-circle">
                    <img src="image.webp" alt="D&M Logo">
                </a>
                <ul class="nav-links">
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="catalog.html" class="nav-link">Catalog</a></li>
                </ul>
                <div class="nav-social" style="display: flex; gap: 8px; margin-left: 8px;">
                    <a href="https://www.facebook.com/share/1Czy5x244P/" target="_blank" rel="noopener noreferrer" class="icon-btn" aria-label="Facebook">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg>
                    </a>
                    <a href="https://www.instagram.com/dandm_bags?igsh=OWYzNHc0MHdxdzN6" target="_blank" rel="noopener noreferrer" class="icon-btn" aria-label="Instagram">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                    </a>
                </div>
            </div>
            <div class="brand-logo">
                <a href="index.html">D&M</a>
            </div>
            <div class="action-icons">
                <button class="icon-btn" id="search-toggle-btn" aria-label="Search">
                    <i data-lucide="search"></i>
                </button>
                <button class="icon-btn cart-btn" id="cart-toggle-btn" aria-label="Shopping Bag">
                    <i data-lucide="shopping-bag"></i>
                    <span class="cart-badge">0</span>
                </button>
            </div>
        </nav>
        
        <!-- Search overlay placeholder (reuses logic from script.js) -->
        <div class="search-overlay" id="search-overlay">
            <div class="search-container">
                <i data-lucide="search" class="search-input-icon"></i>
                <input type="text" id="search-input" placeholder="Search our collection..." autocomplete="off">
                <button id="search-close-btn" class="search-close-btn" aria-label="Close search">
                    <i data-lucide="x"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Product Details Content -->
    <main class="max-w-7xl mx-auto px-4 py-12 lg:py-20 mt-[120px]" id="single-product-container">
        <div id="product-content" class="grid grid-cols-1 md:grid-cols-2 gap-12">
            <div class="min-w-0">
                <div class="zoom-container overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-sm p-4 h-[400px] md:h-[600px] flex items-center justify-center" id="main-image-container">
                    <img src="" alt="" class="zoom-image max-h-full object-contain" id="product-main-image">
                </div>
                <div class="flex gap-4 overflow-x-auto overscroll-x-contain pb-2 mt-4 no-scrollbar w-full" id="thumbnails-container"></div>
                <div class="flex items-center justify-center gap-6 mt-4 select-none">
                    <button id="prev-thumb-btn" class="text-gray-400 hover:text-primary transition-colors cursor-pointer" aria-label="Previous image">
                        <i data-lucide="chevron-left" class="w-6 h-6"></i>
                    </button>
                    <span id="thumb-counter" class="text-base font-semibold text-primary">1/1</span>
                    <button id="next-thumb-btn" class="text-gray-400 hover:text-primary transition-colors cursor-pointer" aria-label="Next image">
                        <i data-lucide="chevron-right" class="w-6 h-6"></i>
                    </button>
                </div>
            </div>

            <div class="flex flex-col min-w-0">
                <span class="text-xs uppercase tracking-widest text-gray-500 font-semibold mb-1">D&M</span>
                <h1 id="product-title" class="text-4xl font-bold mb-4 font-sans text-primary lowercase"></h1>

                <div class="flex items-center gap-4 mb-2 flex-wrap">
                    <span id="product-price" class="text-2xl font-semibold text-accent"></span>
                </div>

                <div class="mb-6">
                    <h3 class="font-medium text-sm text-gray-500 mb-2">Color: <span id="active-color-text" class="text-gray-900 font-semibold"></span></h3>
                    <div class="flex items-center gap-3 flex-wrap" id="color-selector"></div>
                </div>

                <div class="mb-6">
                    <h3 class="font-medium text-sm text-gray-500 mb-2">size</h3>
                    <div class="flex flex-wrap gap-3" id="size-selector"></div>
                </div>

                <div class="mb-8">
                    <h3 class="font-medium text-sm text-gray-500 mb-2">Quantity</h3>
                    <div class="flex items-center border border-gray-300 rounded-full w-32 px-2 py-1 justify-between select-none">
                        <button id="qty-minus" class="w-8 h-8 flex items-center justify-center text-gray-500 hover:text-primary font-bold text-lg cursor-pointer">-</button>
                        <span id="qty-value" class="font-semibold text-primary text-base">1</span>
                        <button id="qty-plus" class="w-8 h-8 flex items-center justify-center text-gray-500 hover:text-primary font-bold text-lg cursor-pointer">+</button>
                    </div>
                </div>

                <div class="mb-8">
                    <button class="w-full bg-primary text-white py-4 rounded-xl font-medium text-lg hover:bg-opacity-90 transition shadow-md" data-action="add-to-cart">Add to Cart</button>
                </div>

                <div id="product-features" class="mb-8"></div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8 pt-6 border-t border-gray-200">
                    <div class="flex items-center gap-3">
                        <div class="bg-white p-2 rounded-full shadow-sm text-primary">
                            <i data-lucide="zap" class="w-5 h-5"></i>
                        </div>
                        <span class="text-sm font-medium">Fast shipping</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="bg-white p-2 rounded-full shadow-sm text-primary">
                            <i data-lucide="phone" class="w-5 h-5"></i>
                        </div>
                        <span class="text-sm font-medium">24/7 Support</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="bg-white p-2 rounded-full shadow-sm text-primary">
                            <i data-lucide="refresh-cw" class="w-5 h-5"></i>
                        </div>
                        <span class="text-sm font-medium">14 Days return</span>
                    </div>
                </div>

                <div>
                    <button id="share-btn" class="flex items-center gap-2 text-primary font-medium hover:text-accent transition">
                        <i data-lucide="share-2" class="w-4 h-4"></i> Share
                    </button>
                </div>
            </div>
        </div>

        <div id="product-not-found" class="hidden text-center py-20">
            <h2 class="text-2xl mb-4">Product not found</h2>
            <a href="index.html" class="text-accent underline">Return to catalog</a>
        </div>
    </main>

    <section class="social-links-bar" aria-label="Social media links">
        <a class="social-links-bar__link" href="https://www.facebook.com/share/1Czy5x244P/" target="_blank" rel="noopener noreferrer">
            <span class="social-links-bar__icon social-links-bar__icon--facebook" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <path fill="currentColor" d="M14 8.5V7c0-.7.5-1 1-1h2V3h-3c-2.2 0-4 1.8-4 4v1.5H8V12h2v9h4v-9h2.7l.3-3.5H14z"/>
                </svg>
            </span>
            <span>Facebook</span>
        </a>
        <a class="social-links-bar__link" href="https://www.instagram.com/dandm_bags?igsh=OWYzNHc0MHdxdzN6" target="_blank" rel="noopener noreferrer">
            <span class="social-links-bar__icon social-links-bar__icon--instagram" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <defs>
                        <linearGradient id="ig-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#feda75" />
                            <stop offset="35%" stop-color="#fa7e1e" />
                            <stop offset="65%" stop-color="#d62976" />
                            <stop offset="100%" stop-color="#4f5bd5" />
                        </linearGradient>
                    </defs>
                    <rect x="4.25" y="4.25" width="15.5" height="15.5" rx="4.25" fill="none" stroke="url(#ig-gradient)" stroke-width="1.8"/>
                    <circle cx="12" cy="12" r="3.2" fill="none" stroke="url(#ig-gradient)" stroke-width="1.8"/>
                    <circle cx="16.6" cy="7.4" r="1.1" fill="url(#ig-gradient)"/>
                </svg>
            </span>
            <span>Instagram</span>
        </a>
    </section>

    <div class="cart-overlay" id="cart-overlay"></div>
    <aside class="cart-panel" id="cart-panel" aria-label="Shopping cart">
        <div class="cart-panel-header">
            <h3 class="cart-panel-title">Your Cart</h3>
            <button class="icon-btn cart-close-btn" id="cart-close-btn" aria-label="Close cart">
                <i data-lucide="x"></i>
            </button>
        </div>
        <div class="cart-items-list" id="cart-items-list"></div>
        <div class="cart-panel-footer">
            <div class="cart-total-row">
                <span>Total</span>
                <strong id="cart-total-price">LE 0.00 EGP</strong>
            </div>
            <button class="cart-whatsapp-btn" id="cart-whatsapp-btn">Send order on WhatsApp</button>
        </div>
    </aside>

    <a href="#" id="wa-float-btn" class="whatsapp-float" aria-label="Send cart to WhatsApp" style="display: none;">
        <svg class="whatsapp-float__icon" viewBox="0 0 32 32" aria-hidden="true">
            <path fill="currentColor" d="M16 3C9.4 3 4 8.3 4 14.9c0 2.4.7 4.7 2.1 6.6L4.6 28l6.7-1.4c1.8.9 3.7 1.4 5.7 1.4 6.6 0 12-5.3 12-11.9C29 8.3 23.6 3 16 3zm0 21.9c-1.8 0-3.6-.5-5.1-1.5l-.4-.2-4 .8.8-3.9-.3-.4c-1-1.5-1.5-3.2-1.5-5C5.5 9.7 10 5.4 16 5.4c5.9 0 10.5 4.3 10.5 9.5S21.9 24.9 16 24.9z"/>
            <path fill="currentColor" d="M22.1 19.1c-.3-.2-2-.9-2.3-1-.3-.1-.5-.2-.8.2-.2.3-.9 1-.9 1.2-.2.2-.3.2-.6.1-.3-.2-1.3-.5-2.5-1.6-1-1-1.6-2.2-1.8-2.5-.2-.3 0-.5.1-.7.1-.1.3-.4.4-.6.1-.2.1-.3.2-.5.1-.2 0-.4 0-.6 0-.2-.8-1.9-1.1-2.6-.3-.6-.6-.5-.8-.5h-.7c-.2 0-.6.1-.9.4-.3.3-1.1 1-1.1 2.4 0 1.4 1.1 2.8 1.2 3 .1.2 2 3.1 4.8 4.3.7.3 1.3.5 1.7.7.7.2 1.3.2 1.8.1.6-.1 2-.8 2.3-1.6.3-.8.3-1.5.2-1.6-.1-.2-.3-.3-.5-.4z"/>
        </svg>
    </a>

    <script src="script.js"></script>
</body>
</html>
